# Fresh start with all permissions granted; waits until demo mode listed the beacons
appId: org.sembeacon
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    # List items are one accessibility node. The Android WebView can leave the online name
    # (BEACON_08) out of that node, so the instance id counts as well.
    visible: '.*(BEACON_08|c187d748).*'
    timeout: 90000
