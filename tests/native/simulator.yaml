appId: org.sembeacon
name: simulator
---
# Advertising is Android-only; the iOS app has no simulator
- runFlow:
    when:
      platform: Android
    commands:
      - startRecording: simulator
      - runFlow: subflows/launch.yaml
      - tapOn:
          text: '(?i)simulator'
          index: 0
      - extendedWaitUntil:
          visible: '.*https://sembeacon\.org.*'
          timeout: 30000
      - takeScreenshot: 03-simulator
      - stopRecording
