name: Android release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web app
        run: yarn build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      - name: Copy web app and plugins into the Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list contains 'tools', which current SDK tools no longer have
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Put apksigner on the PATH
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'keystore/sembeacon.jks'
          encodedString: ${{ secrets.KEYSTORE }}
      
      - name: Build Android application (APK)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: npx cap build android --androidreleasetype APK --signing-type apksigner --keystorepath "${{ steps.decode_keystore.outputs.filePath }}" --keystorepass "$SIGNING_STORE_PASSWORD" --keystorealias "$SIGNING_KEY_ALIAS" --keystorealiaspass "$SIGNING_KEY_PASSWORD"

      - name: Verify APK signature
        # Target SDK 30+ requires signature scheme v2 or later; jarsigner (v1) APKs do not install
        run: apksigner verify --verbose android/app/build/outputs/apk/release/app-release-signed.apk

      - name: Build Android application (AAB)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: npx cap build android --androidreleasetype AAB --keystorepath "${{ steps.decode_keystore.outputs.filePath }}" --keystorepass "$SIGNING_STORE_PASSWORD" --keystorealias "$SIGNING_KEY_ALIAS" --keystorealiaspass "$SIGNING_KEY_PASSWORD"

      - name: Verify AAB signature
        # An App Bundle is a signed JAR, not an APK, so verify it with jarsigner.
        # No -strict: the release certificate is self-signed and that would be a warning.
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release-signed.aab

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk

      - name: Archive AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/app-release-signed.aab