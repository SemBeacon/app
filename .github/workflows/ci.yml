name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture App Store / Play Store screenshots
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E and visual regression
    runs-on: ubuntu-latest
    # Same image as scripts/playwright-docker.js: visual baselines depend on its fonts.
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: >-
          npx playwright test
          --project=chromium-mobile --project=webkit-mobile
          --project=visual-android --project=visual-ios
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  screenshots:
    name: Store screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: npx playwright test -c playwright.screenshots.config.ts
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: resources/screenshots/
